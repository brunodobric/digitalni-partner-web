<!doctype html>
<html lang="hr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Nadzor poslovanja · Digitalni partner</title>
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--oniks:#0B0B0C;--smaragd:#0F3B33;--smaragd-svj:#E8EFED;--kamen:#E7E4DE;--kamen-svj:#F1EFEA;--grafit:#5E6266;--zlato:#C6A15B;--zlato-tamno:#7A5B1E;--zlato-svj:#FBF5E8;--kadulja:#6E8F86;--crvena:#A33A2A;--crvena-svj:#FBEDEA;--pozadina:#F6F6F3;--kartica:#FFFFFF;--linija:#E4E2DD;--linija-svj:#EFEDE9}
*{box-sizing:border-box}
body{margin:0;background:var(--pozadina);color:var(--oniks);font:400 15px/1.55 Manrope,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:var(--smaragd)}
h1,h2,p{margin:0}
h1{font-size:clamp(24px,3vw,30px);font-weight:700;letter-spacing:-.02em;line-height:1.15}
h2{font-size:16px;font-weight:700;letter-spacing:-.005em}
.wrap{max-width:1240px;margin:0 auto;padding:0 24px}
header{background:var(--smaragd);color:var(--kamen);position:sticky;top:0;z-index:5}
header .wrap{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 32px;min-height:64px}
.brand{display:flex;align-items:center;gap:12px}
.mono{width:30px;height:30px;border-radius:7px;background:var(--kamen);color:var(--smaragd);display:grid;place-items:center;font-weight:700;font-size:14px;letter-spacing:-.02em}
.word{font-size:17px;color:#fff}.word b{font-weight:700}
.sub{font-size:12.5px;color:rgba(231,228,222,.75);margin-left:4px;padding-left:12px;border-left:1px solid rgba(231,228,222,.3)}
nav{display:flex;flex-wrap:wrap;gap:4px}
nav button{background:none;border:0;border-radius:8px;font:600 14px Manrope,sans-serif;color:rgba(231,228,222,.8);padding:0 14px;cursor:pointer;min-height:40px;position:relative}
nav button:hover{background:rgba(255,255,255,.08);color:#fff}
nav button[aria-selected=true]{background:rgba(255,255,255,.12);color:#fff}
nav button[aria-selected=true]::after{content:"";position:absolute;left:14px;right:14px;bottom:4px;height:2px;border-radius:2px;background:var(--zlato)}
main .wrap{padding-top:28px;padding-bottom:48px;display:flex;flex-direction:column;gap:20px}
.lbl{font-size:12.5px;font-weight:600;color:var(--grafit)}
.panel{background:var(--kartica);border:1px solid var(--linija);border-radius:12px;box-shadow:0 1px 2px rgba(11,11,12,.04);padding:20px 22px;display:flex;flex-direction:column;gap:16px;min-width:0}
.red{display:flex;flex-wrap:wrap;gap:20px}
.red>.sir{flex:999 1 560px}.red>.uz{flex:1 1 320px}
.num{font-variant-numeric:tabular-nums}
.src{font-size:12.5px;color:var(--grafit)}
.og{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.04em;color:var(--zlato-tamno);background:var(--zlato-svj);border:1px solid #EFE3C8;border-radius:999px;padding:1px 7px;margin-left:8px;vertical-align:middle;line-height:1.5}
.zeleno{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:20px}
.zeleno>div,.kpi>div{background:var(--kartica);border:1px solid var(--linija);border-radius:12px;box-shadow:0 1px 2px rgba(11,11,12,.04);padding:20px 22px;display:flex;flex-direction:column;gap:8px;min-width:0}

.zeleno .k{font-size:13px;font-weight:600;color:var(--grafit)}
.zeleno .v{font-size:clamp(30px,4vw,38px);font-weight:700;letter-spacing:-.025em;line-height:1.1;color:var(--oniks)}
.zeleno .o{font-size:13px;color:var(--grafit)}
.bar{height:8px;border-radius:4px;background:var(--linija-svj);overflow:hidden}.bar i{display:block;height:100%;border-radius:4px;background:var(--smaragd)}
.kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:20px}
.kpi .v{font-size:30px;font-weight:700;letter-spacing:-.02em;line-height:1.15}
table{border-collapse:collapse;width:100%;font-size:14px}
th{text-align:left;font-size:12px;font-weight:600;color:var(--grafit);padding:0 16px 10px 0;border-bottom:1px solid var(--linija);white-space:nowrap}
td{padding:11px 16px 11px 0;border-bottom:1px solid var(--linija-svj);vertical-align:top}
tbody tr:last-child td{border-bottom:0}
.r{text-align:right}.nw{white-space:nowrap}
.skrol{overflow-x:auto}
.stavka{padding:10px 12px;border-radius:8px;background:var(--pozadina);border-left:3px solid var(--zlato);display:flex;flex-direction:column;gap:2px}
.stavka:has(.hitno){background:var(--crvena-svj);border-left-color:var(--crvena)}
.stavka b{font-size:11.5px;letter-spacing:.06em;color:var(--zlato-tamno)}
.stavka b.hitno{color:var(--crvena)}
.hitno{color:var(--crvena);font-weight:600}
.trak{height:8px;border-radius:4px;background:var(--linija-svj);overflow:hidden}.trak i{display:block;height:100%;border-radius:4px;background:var(--smaragd)}
.legenda{display:flex;flex-wrap:wrap;gap:14px;font-size:13px;color:var(--grafit)}
.legenda span{display:flex;align-items:center;gap:6px}.legenda i{width:10px;height:10px;border-radius:3px;display:inline-block}
form.unos{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;align-items:end;padding-top:16px;border-top:1px solid var(--linija-svj)}
label{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--grafit)}
input,select{font:inherit;font-size:14px;padding:8px 10px;border:1px solid #D4D1CB;border-radius:8px;background:#fff;color:var(--oniks);min-height:40px}
button.gumb{font:600 14px Manrope,sans-serif;background:var(--smaragd);color:#fff;border:0;border-radius:8px;padding:0 18px;min-height:40px;cursor:pointer}
button.gumb:hover{background:#0B2E28}
button.tiho{font:600 13px Manrope,sans-serif;background:none;color:var(--grafit);border:1px solid var(--linija);border-radius:8px;padding:0 12px;min-height:32px;cursor:pointer}
button.tiho:hover{color:var(--oniks);background:var(--pozadina)}
.gumbi{display:flex;gap:8px}.gumbi .gumb{flex:1;white-space:nowrap}
@media (max-width:640px){.gumbi{grid-column:1/-1}}
button.uredi{flex:none;width:40px;height:40px;display:grid;place-items:center;padding:0;border:1px solid #D4D1CB;border-radius:8px;background:#fff;color:var(--smaragd);cursor:pointer}
button.uredi:hover{background:var(--smaragd-svj)}
button.uredi[aria-pressed=true]{background:var(--smaragd);border-color:var(--smaragd);color:#fff}
button.minus{width:28px;height:28px;display:grid;place-items:center;padding:0;border:0;border-radius:50%;background:var(--crvena);color:#fff;cursor:pointer}
button.minus:hover{background:#82291C}
button.gumb.opasno{background:var(--crvena);min-height:36px}button.gumb.opasno:hover{background:#82291C}
tr.potvrda td{background:var(--crvena-svj);padding:12px 14px}
.potvrda-tekst{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 16px;font-size:14px}
.potvrda-tekst div{display:flex;gap:8px}
:focus-visible{outline:2px solid var(--zlato);outline-offset:2px}
footer .wrap{padding-top:4px;padding-bottom:28px;display:flex;flex-wrap:wrap;gap:6px 24px}
[hidden]{display:none!important}
.prazno{color:var(--grafit);font-size:14px}
.oznaka{display:inline-block;font-size:12px;font-weight:600;border-radius:999px;padding:1px 9px;line-height:1.6;white-space:nowrap}
.oznaka.ok{color:var(--smaragd);background:var(--smaragd-svj)}
.oznaka.ceka{color:var(--zlato-tamno);background:var(--zlato-svj)}
.oznaka.lose{color:var(--crvena);background:var(--crvena-svj)}
.filtri{display:flex;flex-wrap:wrap;gap:12px;align-items:end}
.kpr-zbroj td{font-weight:700;border-top:1px solid var(--linija)}
.jir{font-family:ui-monospace,Menlo,monospace;font-size:12px;color:var(--grafit);word-break:break-all}
svg text{font-family:Manrope,sans-serif}
.izb,.ekran-m{display:none}
@media (max-width:640px){.wrap{padding:0 16px}header .wrap{padding-top:8px;padding-bottom:8px}.sub{display:none}nav button{padding:0 10px}.panel,.zeleno>div,.kpi>div{padding:16px}}
/* Mobitel: ekrani se otvaraju iz izbornika (tipka s tri crte gore desno), a uz logo piše na kojem si ekranu */
@media (max-width:640px){
  header .wrap{flex-wrap:nowrap;min-height:56px}
  .ekran-m{display:block;font-size:13px;color:rgba(231,228,222,.75);padding-left:12px;border-left:1px solid rgba(231,228,222,.3)}
  .izb{display:grid;place-content:center;gap:5px;width:44px;height:44px;margin-right:-10px;padding:0;border:0;border-radius:8px;background:none;cursor:pointer}
  .izb span{display:block;width:22px;height:2px;border-radius:1px;background:var(--kamen);transition:transform .2s,opacity .15s}
  header.otvoren .izb span:nth-child(1){transform:translateY(7px) rotate(45deg)}
  header.otvoren .izb span:nth-child(2){opacity:0}
  header.otvoren .izb span:nth-child(3){transform:translateY(-7px) rotate(-45deg)}
  nav{display:none;position:absolute;top:100%;left:0;right:0;flex-direction:column;gap:2px;background:var(--smaragd);border-top:1px solid rgba(231,228,222,.15);padding:8px 16px 16px;box-shadow:0 12px 24px rgba(11,11,12,.18)}
  header.otvoren nav{display:flex}
  nav button{text-align:left;font-size:16px;min-height:48px;padding:0 12px}
  nav button[aria-selected=true]::after{left:12px;right:auto;width:24px;bottom:8px}
}
/* Pošta: tri stupca preko cijelog ekrana (mape, popis, čitač); na mobitelu popis ili čitač */
.bedz{display:inline-block;min-width:18px;margin-left:6px;padding:0 5px;border-radius:999px;background:var(--zlato);color:var(--oniks);font-size:11px;font-weight:700;line-height:18px;text-align:center}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
body.po-cijelo{height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden}
body.po-cijelo main{flex:1;min-height:0}
body.po-cijelo main .wrap{max-width:none;padding:0;gap:0;height:100%}
body.po-cijelo footer{display:none}
.po-app{position:relative;display:grid;grid-template-columns:232px minmax(300px,400px) minmax(0,1fr);height:100%;background:#fff;font-size:14px;line-height:1.5}
svg.ik{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
svg.ik.mali{width:14px;height:14px}
.po-app button{font-family:inherit}
.po-ik{width:34px;height:34px;display:inline-grid;place-items:center;border:0;border-radius:8px;background:none;color:var(--grafit);cursor:pointer;padding:0;text-decoration:none;flex:none}
.po-ik:hover{background:var(--pozadina);color:var(--oniks)}
.po-ik.opasno:hover{background:var(--crvena-svj);color:var(--crvena)}
.po-ik.vrti svg{animation:po-vrti .6s linear}
@keyframes po-vrti{to{transform:rotate(360deg)}}
/* mape */
.po-mape{background:var(--pozadina);border-right:1px solid var(--linija);padding:16px 12px;display:flex;flex-direction:column;gap:2px;overflow:auto}
.po-pisi{display:flex;align-items:center;justify-content:center;gap:8px;background:var(--smaragd);color:#fff;border:0;border-radius:10px;min-height:42px;font:600 14px Manrope,sans-serif;margin-bottom:14px}
.po-pisi:disabled{opacity:.45;cursor:not-allowed}.po-pisi small{font-weight:500;font-size:11px;opacity:.85}
.po-mapa{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;color:var(--oniks);font-weight:500;cursor:pointer;width:100%}
.po-mapa>span:not(.n):not(.toc){overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.po-mapa:hover{background:rgba(11,11,12,.04)}
.po-mapa:focus-visible{outline:2px solid var(--zlato)}
.po-mapa svg{color:var(--grafit)}
.po-mapa .n{margin-left:auto;font-size:12.5px;color:var(--grafit);font-variant-numeric:tabular-nums}
.po-mapa .n.jako{font-weight:700;color:var(--oniks)}
.po-mapa[aria-current=true]{background:var(--smaragd-svj);color:var(--smaragd);font-weight:700}
.po-mapa[aria-current=true] svg,.po-mapa[aria-current=true] .n{color:var(--smaragd)}
.po-nasl{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--grafit);padding:16px 10px 6px}
.toc{width:8px;height:8px;border-radius:50%;flex:none;margin:0 5px}
/* popis */
.po-lista{border-right:1px solid var(--linija);display:flex;flex-direction:column;min-height:0;min-width:0}
.po-alatna{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--linija-svj);min-height:63px}
.po-sve{display:grid;place-items:center;width:34px;height:34px;cursor:pointer;flex:none}
.po-sve input,.po-av-k input{width:16px;height:16px;min-height:0;margin:0;accent-color:var(--smaragd);cursor:pointer}
.po-trazi{flex:1;display:flex;align-items:center;gap:8px;background:var(--pozadina);border:1px solid var(--linija);border-radius:9px;padding:0 10px;height:38px;color:var(--grafit);min-width:0}
.po-trazi:focus-within{border-color:var(--smaragd);background:#fff}
.po-trazi input{flex:1;border:0;background:none;padding:0;min-height:0;height:36px;min-width:0;font-size:14px;outline:none}
.po-trazi kbd,.po-precaci kbd{font:600 11px Manrope,sans-serif;border:1px solid var(--linija);border-radius:4px;padding:0 5px;background:#fff;color:var(--grafit)}
.po-trazi:focus-within kbd{display:none}
.po-traka{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 12px;padding:8px 14px;background:var(--pozadina);border-bottom:1px solid var(--linija-svj);font-size:13px;color:var(--grafit)}
.po-traka.odabrano{background:var(--smaragd-svj);color:var(--smaragd);justify-content:flex-start;padding:6px 14px}
.po-traka.odabrano b{margin-right:auto}
.po-traka.opasno{background:var(--crvena-svj);color:var(--oniks)}
.po-traka.zlato{background:var(--zlato-svj);color:var(--oniks)}
.po-tijelo .po-traka{border-radius:10px;margin-bottom:16px;padding:12px 14px}
.po-traka-g{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.po-skup{flex:1;overflow:auto;min-height:0}
.po-grupa{font-size:11.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--grafit);padding:12px 16px 6px;background:#fff;position:sticky;top:0;z-index:1}
.po-m{display:grid;grid-template-columns:36px minmax(0,1fr);gap:12px;padding:10px 16px 11px 18px;border-bottom:1px solid var(--linija-svj);position:relative}
.po-m:hover{background:var(--pozadina)}
.po-m.on{background:var(--smaragd-svj)}
.po-m.odabran{background:#F3F7F5}
.po-m.novo::before{content:"";position:absolute;left:6px;top:24px;width:7px;height:7px;border-radius:50%;background:var(--zlato)}
.po-m.stiglo{animation:po-stiglo 4s ease-out}
@keyframes po-stiglo{0%,30%{background:var(--zlato-svj)}100%{background:transparent}}
.po-av-k{position:relative;width:36px;height:36px;display:grid;place-items:center;cursor:pointer;color:inherit;font-size:inherit}
.po-av-k input{position:absolute;opacity:0}
.po-av{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13px;color:#fff;flex:none;letter-spacing:.01em}
.po-av.vel{width:42px;height:42px;font-size:14px}
.po-m:hover .po-av-k .po-av,.po-app.odabir .po-av-k .po-av,.po-av-k:focus-within .po-av{display:none}
.po-m:hover .po-av-k input,.po-app.odabir .po-av-k input,.po-av-k input:focus-visible{opacity:1}
.po-otvori{all:unset;box-sizing:border-box;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:1px 10px;cursor:pointer;min-width:0}
.po-otvori:focus-visible{outline:2px solid var(--zlato);outline-offset:4px;border-radius:4px}
.po-od{font-weight:500;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.po-vr{font-size:12px;color:var(--grafit);white-space:nowrap;display:flex;align-items:center;gap:5px;justify-content:flex-end}
.po-ns{grid-column:1/-1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;padding-right:26px}
.po-is{grid-column:1/-1;font-size:12.5px;color:var(--grafit);overflow:hidden;white-space:nowrap;display:flex;gap:6px;align-items:center;padding-right:26px}
.po-isj{overflow:hidden;text-overflow:ellipsis}
.po-m.novo .po-od,.po-m.novo .po-ns{font-weight:700}
.po-adr{font-size:11px;font-weight:600;border-radius:5px;padding:0 6px;line-height:18px;white-space:nowrap;flex:none}
.po-oz{font-size:11px;font-weight:700;border-radius:999px;padding:0 7px;line-height:18px;color:var(--smaragd);background:var(--smaragd-svj);white-space:nowrap;flex:none}
.po-oz.lose{color:var(--crvena);background:var(--crvena-svj)}
.po-oz.siv{color:var(--grafit);background:var(--linija-svj)}
.po-zv{position:absolute;right:12px;top:32px;width:28px;height:28px;display:grid;place-items:center;border:0;background:none;border-radius:6px;color:var(--linija);cursor:pointer;padding:0;opacity:0}
.po-zv svg{width:16px;height:16px}
.po-zv.da{color:var(--zlato);opacity:1}.po-zv.da svg{fill:var(--zlato)}
.po-m:hover .po-zv,.po-zv:focus-visible{opacity:1;color:var(--grafit)}
.po-m:hover .po-zv.da{color:var(--zlato)}
.po-cit-alati .po-zv{position:static;width:34px;height:34px;opacity:1;color:var(--grafit)}
.po-cit-alati .po-zv.da{color:var(--zlato)}
.po-brze{position:absolute;right:12px;top:6px;display:none;gap:2px;background:#fff;border:1px solid var(--linija);border-radius:8px;padding:2px;box-shadow:0 2px 6px rgba(11,11,12,.08)}
.po-brze .po-ik{width:28px;height:28px}.po-brze svg{width:16px;height:16px}
@media (hover:hover){.po-m:hover .po-brze,.po-brze:focus-within{display:flex}}
.po-prazno{color:var(--grafit);padding:24px 18px;font-size:14px}
.po-starije{display:block;margin:12px auto}
.po-kraj{text-align:center;font-size:12px;color:var(--grafit);padding:14px}
/* čitač */
.po-citac{display:flex;flex-direction:column;min-height:0;min-width:0}
.po-cit-alati{justify-content:space-between}
.po-grupa-ik{display:flex;gap:2px;align-items:center}
.po-natrag{display:none}
.po-tijelo{flex:1;overflow:auto;padding:24px 32px 40px;min-height:0}
.po-naslov{font-size:22px;font-weight:700;letter-spacing:-.015em;margin:0 0 18px;line-height:1.25;word-break:break-word}
.po-spam{margin:0 0 16px;padding:10px 14px;border-radius:10px;background:var(--crvena-svj);font-size:14px}
.po-spam b{color:var(--crvena);margin-right:6px;font-size:12px;letter-spacing:.05em;text-transform:uppercase}
.po-spam.siv{background:var(--pozadina)}.po-spam.siv b{color:var(--grafit)}
.po-posi{display:flex;gap:12px;align-items:flex-start}
.po-tko{flex:1;min-width:0;word-break:break-word}.po-tko b{font-size:15px}.po-tko .src{font-size:13px}
.po-provjera{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.po-provjera span{font-size:11px;font-weight:600;border-radius:999px;padding:0 8px;line-height:20px}
.po-provjera .ok{color:var(--smaragd);background:var(--smaragd-svj)}.po-provjera .ceka{color:var(--zlato-tamno);background:var(--zlato-svj)}.po-provjera .lose{color:var(--crvena);background:var(--crvena-svj)}
.po-kad{font-size:13px;color:var(--grafit);white-space:nowrap}
.po-detalji{margin:14px 0 0 54px;font-size:13px}
.po-detalji summary{cursor:pointer;color:var(--grafit);font-weight:600;width:max-content}
.po-detalji .mail-glava{margin-top:8px;font-size:13px}
.po-izvod{margin:16px 0 0;padding:10px 14px;border-radius:10px;background:var(--smaragd-svj);font-size:14px}

.po-toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);z-index:15;background:var(--oniks);color:#fff;border-radius:10px;padding:10px 16px;font-size:13.5px;display:flex;gap:16px;align-items:center;opacity:0;pointer-events:none;transition:opacity .15s,transform .15s;max-width:calc(100vw - 32px)}

@media (max-width:1200px) and (min-width:901px){.po-app{grid-template-columns:200px minmax(280px,340px) minmax(0,1fr)}.po-tijelo{padding:20px 24px 32px}}

}

<body>
<header><div class="wrap">
  <div class="brand"><div class="mono">dp</div><div class="word"><b>digitalni</b>partner</div><div class="sub">nadzor poslovanja</div><div class="ekran-m" id="ekran-m"></div></div>
  <button class="izb" type="button" aria-label="Izbornik" aria-expanded="false" aria-controls="ekrani"><span></span><span></span><span></span></button>
  <nav role="tablist" aria-label="Ekrani" id="ekrani">
    <button role="tab" data-ekran="pregled" aria-selected="true">Pregled</button>
    <button role="tab" data-ekran="usluge" aria-selected="false">Usluge</button>
    <button role="tab" data-ekran="aplikacije" aria-selected="false">Aplikacije</button>
    <button role="tab" data-ekran="vjencanja" aria-selected="false">Kuverta</button>
    <button role="tab" data-ekran="racuni" aria-selected="false">Računi</button>
    <button role="tab" data-ekran="banka" aria-selected="false">Banka</button>
    <button role="tab" data-ekran="knjige" aria-selected="false">Knjige</button>
    <button role="tab" data-ekran="posta" aria-selected="false">Pošta<span class="bedz" id="posta-bedz" hidden></span></button>
    <button role="tab" data-ekran="obavijesti" aria-selected="false">Obavijesti</button>
  </nav>
</div></header>
<main><div class="wrap" id="sadrzaj"><p class="prazno">Učitavam podatke…</p></div></main>
<footer><div class="wrap"><span class="src" id="osvjezeno"></span><span class="src" id="korisnik"></span></div></footer>

<script>
(function(){
"use strict";
var uredjivanje = false, D = null, ekran = (location.hash || "#pregled").slice(1);
var MJ = ["siječanj","veljača","ožujak","travanj","svibanj","lipanj","srpanj","kolovoz","rujan","listopad","studeni","prosinac"];
var MJK = ["Sij","Velj","Ožu","Tra","Svi","Lip","Srp","Kol","Ruj","Lis","Stu","Pro"];
var PRAG = 60000;

function e(s){ return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]; }); }
function eur(n, dec){ var v = Number(n || 0); var s = v.toLocaleString("hr-HR", {minimumFractionDigits: dec ? 2 : 0, maximumFractionDigits: dec ? 2 : 0}); return s + " €"; }
function br(n){ return Number(n || 0).toLocaleString("hr-HR"); }
function pct(n){ return (n >= 0 ? "+" : "") + n.toLocaleString("hr-HR", {maximumFractionDigits: 1}) + " %"; }
function datum(d){ if(!d) return "–"; var p = String(d).slice(0,10).split("-"); return Number(p[2]) + ". " + Number(p[1]) + "."; }
function dana(d){ return Math.round((new Date(String(d).slice(0,10)) - new Date(D.danas)) / 864e5); }
function zbroj(a, f){ return a.reduce(function(s, x){ return s + Number(f(x) || 0); }, 0); }

function ucitaj(){
  fetch("/api/podaci", {credentials: "same-origin"}).then(function(r){ if(!r.ok) throw new Error(r.status); return r.json(); })
    .then(function(d){ D = d; crtaj(); })
    .catch(function(err){ document.getElementById("sadrzaj").innerHTML = '<p class="prazno">Podaci se nisu učitali (' + e(err.message) + '). Osvježi stranicu za minutu.</p>'; });
}

// Označi odabrani ekran u izborniku i upiši njegov naziv uz logo (vidi se samo na mobitelu)
function oznaci(){
  document.querySelectorAll("nav button").forEach(function(b){ b.setAttribute("aria-selected", b.dataset.ekran === ekran ? "true" : "false"); if (b.dataset.ekran === ekran) document.getElementById("ekran-m").textContent = b.firstChild.textContent; });
}

function crtaj(){
  oznaci();
  var f = {pregled: pregled, usluge: usluge, aplikacije: aplikacije, vjencanja: vjencanja, racuni: racuni, banka: banka, knjige: knjige, posta: postaEkran, obavijesti: obavijesti}[ekran] || pregled;
  document.body.classList.toggle("po-cijelo", ekran === "posta");
  // Pošta se, kad je već na ekranu, samo osvježi (otvoreni mail i pozicija na popisu ostaju).
  if (ekran === "posta" && document.getElementById("po-app")) poCrtaj("ml");
  else document.getElementById("sadrzaj").innerHTML = f();
  if (ekran === "pregled") vezi();
  if (ekran === "usluge") veziUpite();
  if (ekran === "racuni") veziRacune();
  if (ekran === "vjencanja") { veziKorisnike(); var izd = document.getElementById("izvori-dana"); if (izd) izd.addEventListener("change", function(){ izDana = Number(izd.value); izGreska = ""; crtaj(); }); }
  if (ekran === "banka") veziBanku();
  if (ekran === "knjige") veziKnjige();
  if (ekran === "posta") veziPostu();
  var o = D.osvjezavanja, dijelovi = Object.keys(o).map(function(k){ var x = o[k]; return k + ": " + new Date(x.vrijeme).toLocaleString("hr-HR", {day:"numeric",month:"numeric",hour:"2-digit",minute:"2-digit"}) + (x.uspjeh ? "" : " (greška)"); });
  document.getElementById("osvjezeno").textContent = dijelovi.length ? "Zadnje osvježavanje · " + dijelovi.join(" · ") : "Prikupljači se još nisu pokrenuli.";
  document.getElementById("korisnik").textContent = D.korisnik ? "Prijavljen: " + D.korisnik : "";
}

// ---------- izračuni ----------
function mjeseci(){ return D.prihodi_po_mjesecima; }
function ovaj(){ var m = mjeseci(); return m[m.length - 1]; }
function prosli(){ var m = mjeseci(); return m[m.length - 2]; }
function ukupno(m){ return Number(m.usluge) + Number(m.aplikacije) + Number(m.vjencanja); }
function mrr(){ return zbroj(D.klijenti, function(k){ return k.mjesecno; }); }
function met(k){ return D.metrike[k] || null; }

// ---------- Pregled ----------
function pregled(){
  var t = ovaj(), p = prosli(), u = ukupno(t), up = ukupno(p);
  var promjena = up ? (u - up) / up * 100 : 0;
  var god = Number(D.prihod_godina), udio = Math.min(100, god / PRAG * 100);
  var danUGod = (new Date(D.danas) - new Date(D.danas.slice(0,4) + "-01-01")) / 864e5 + 1;
  var tempo = god / danUGod, ostaje = tempo > 0 ? (PRAG - god) / tempo : Infinity;
  var kad = god >= PRAG ? "Prag je dosegnut." : (isFinite(ostaje) ? "Uz ovaj tempo prag se dostiže oko " + new Date(Date.now() + ostaje * 864e5).toLocaleDateString("hr-HR", {month:"long", year:"numeric"}).replace(/\.$/, "") + "." : "Još nema prihoda.");
  var mj = MJ[Number(D.danas.slice(5,7)) - 1];

  var h = '<div style="display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:12px 32px"><div style="display:flex;flex-direction:column;gap:10px"><p class="lbl">Cijeli obrt</p><h1>' + e(mj.charAt(0).toUpperCase() + mj.slice(1)) + ' ' + D.danas.slice(0,4) + '.</h1></div><p class="src">Stanje ' + datum(D.danas) + '</p></div>';
  h += '<section class="zeleno" aria-label="Glavni brojevi">'
    + '<div><span class="k">Prihod ovog mjeseca</span><span class="v num">' + eur(u) + '</span><span class="o">' + (up ? pct(promjena) + " u odnosu na prošli mjesec (" + eur(up) + ")" : "Prošli mjesec bez prihoda.") + '</span></div>'
    + '<div><span class="k">Mjesečni ponavljajući prihod</span><span class="v num">' + eur(mrr()) + '</span><span class="o">' + D.klijenti.length + ' aktivnih klijenata</span></div>'
    + '<div style="border-right:0"><span class="k">Prag od 60.000 € ove godine</span><span class="v num">' + Math.round(udio) + ' %</span><div class="bar" role="img" aria-label="Naplaćeno ' + eur(god) + ' od 60.000 €"><i style="width:' + udio.toFixed(1) + '%"></i></div><span class="o">' + eur(god) + ' naplaćeno. ' + kad + '</span></div>'
    + '</section>';

  h += '<div class="red"><section class="panel sir"><div style="display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px"><h2>Prihod po mjesecima</h2><div class="legenda"><span><i style="background:#0F3B33"></i>Usluge</span><span><i style="background:#6E8F86"></i>Aplikacije</span><span><i style="background:#C6A15B"></i>Kuverta</span></div></div><p class="num" id="tip" style="min-height:22px;font-size:14px"></p>' + grafPrihoda() + '<p class="src">Iznosi su nakon provizije Applea i naknada Stripea.</p></section>';
  h += '<section class="panel uz"><h2>Za danas</h2>' + zaDanas() + '</section></div>';

  var kv = D.kuverta || {};
  h += '<section class="panel"><h2>Poslovne linije</h2><div class="skrol"><table class="num"><thead><tr><th>Linija</th><th class="r">Ovaj mjesec</th><th class="r">Prošli</th><th>Korisnici</th><th>Ključni broj</th></tr></thead><tbody>'
    + linija("#0F3B33", "Usluge za klijente", t.usluge, p.usluge, D.klijenti.length + " klijenata", "MRR " + eur(mrr()))
    + linija("#6E8F86", "Aplikacije", t.aplikacije, p.aplikacije, met("aplikacije.aktivni_mjesecno") ? br(met("aplikacije.aktivni_mjesecno").vrijednost) + " aktivnih mjesečno" : "nije spojeno", met("aplikacije.pretplatnici") ? br(met("aplikacije.pretplatnici").vrijednost) + " pretplatnika" : "")
    + linija("#C6A15B", "Kuverta", t.vjencanja, p.vjencanja, kv.greska ? "baza nedostupna" : br(kv.pozivnice) + " pozivnica u bazi", kv.greska ? "" : br(zbroj(kv.po_mjesecima || [], function(x){ return x.broj; })) + " vjenčanja u 12 mjeseci")
    + '</tbody></table></div></section>';

  var tr = D.troskovi_ovaj_mjesec, tu = zbroj(tr, function(x){ return x.iznos; });
  h += '<section class="panel"><div style="display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px"><h2>Troškovi ovog mjeseca</h2><span class="num" style="font-weight:600">' + eur(tu, true) + ' · dobit ' + eur(u - tu, true) + '</span></div>'
    + (tr.length ? '<div class="skrol"><table class="num"><tbody>' + tr.map(function(x){ return '<tr data-trosak="' + x.id + '"><td>' + e(x.opis) + '</td><td class="src">' + e(x.linija) + '</td><td class="nw">' + datum(x.datum) + '</td><td class="r nw">' + eur(x.iznos, true) + '</td>' + (uredjivanje ? '<td class="r" style="padding-right:0;width:1%"><button type="button" class="minus" data-makni="' + x.id + '" aria-label="Obriši trošak ' + e(x.opis) + '"><svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><rect x="1" y="5" width="10" height="2" rx="1" fill="currentColor"/></svg></button></td>' : '') + '</tr>'; }).join("") + '</tbody></table></div>' : '<p class="prazno">Ovaj mjesec još nema upisanih troškova.</p>')
    + '<form class="unos" id="trosak"><label>Datum<input name="datum" type="date" required value="' + D.danas + '"></label><label>Opis<input name="opis" required maxlength="200" placeholder="npr. domena"></label><label>Iznos (€)<input name="iznos" type="number" step="0.01" min="0" required></label><label>Linija<select name="linija"><option value="obrt">Obrt</option><option value="usluge">Usluge</option><option value="aplikacije">Aplikacije</option><option value="vjencanja">Kuverta</option></select></label><div class="gumbi"><button class="gumb" type="submit">Dodaj trošak</button><button class="uredi" type="button" id="uredi-troskove" aria-pressed="' + (uredjivanje ? "true" : "false") + '" aria-label="Uredi troškove" title="Uredi troškove"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16v4z"/><path d="M13.5 6.5l4 4"/></svg></button></div></form><p class="src" id="trosak-poruka" role="status"></p></section>';
  return h;
}

function linija(boja, ime, a, b, korisnici, kljucni){
  var ch = Number(b) ? pct((a - b) / b * 100) : "–";
  return '<tr><td class="nw" style="font-weight:600"><i style="display:inline-block;width:10px;height:10px;background:' + boja + ';margin-right:10px"></i>' + e(ime) + '</td><td class="r nw">' + eur(a) + '</td><td class="r nw">' + eur(b) + ' <span class="src">' + ch + '</span></td><td>' + korisnici + '</td><td>' + e(kljucni) + '</td></tr>';
}

function grafPrihoda(){
  var m = mjeseci(), max = Math.max(1000, Math.max.apply(null, m.map(ukupno)));
  var korak = max > 6000 ? 2000 : (max > 3000 ? 1000 : 500); max = Math.ceil(max / korak) * korak;
  var base = 240, ph = 205, slot = (712 - 56) / m.length, w = Math.min(56, slot * .6), s = "";
  for (var g = 0; g <= max; g += korak){ var y = base - g / max * ph; s += '<line x1="56" x2="712" y1="' + y + '" y2="' + y + '" stroke="rgba(11,11,12,.08)"/><text x="48" y="' + (y + 4) + '" text-anchor="end" font-size="11.5" fill="#5E6266">' + (g ? (g >= 1000 ? (g / 1000) + "k" : g) : 0) + '</text>'; }
  m.forEach(function(x, i){
    var X = 56 + i * slot + (slot - w) / 2, y = base, seg = [["usluge","#0F3B33"],["aplikacije","#6E8F86"],["vjencanja","#C6A15B"]];
    seg.forEach(function(sg){ var hh = Number(x[sg[0]]) / max * ph; if (hh > 0){ y -= hh; s += '<rect x="' + X + '" y="' + y + '" width="' + w + '" height="' + Math.max(0, hh - 2) + '" fill="' + sg[1] + '"/>'; } });
    var mi = Number(x.mjesec.slice(5,7)) - 1;
    s += '<text x="' + (X + w / 2) + '" y="' + (y - 8) + '" text-anchor="middle" font-size="12" font-weight="600" fill="#0B0B0C">' + (ukupno(x) ? eur(ukupno(x)) : "") + '</text><text x="' + (X + w / 2) + '" y="262" text-anchor="middle" font-size="12" fill="#5E6266">' + MJK[mi] + '</text>';
    s += '<rect class="hit" data-i="' + i + '" x="' + (56 + i * slot) + '" y="0" width="' + slot + '" height="270" fill="transparent" tabindex="0" aria-label="' + MJ[mi] + ' ' + eur(ukupno(x)) + '"/>';
  });
  return '<svg viewBox="0 0 720 270" role="img" aria-label="Prihod po mjesecima, složeno po linijama" style="width:100%;height:auto;display:block">' + s + '</svg>';
}

function zaDanas(){
  var st = [];
  D.klijenti.forEach(function(k){
    if (k.stanje === "neuspjela naplata") st.push(["hitno", "NEUSPJELA NAPLATA", e(k.oznaka) + ", " + e(k.paket) + ", " + eur(k.mjesecno) + "."]);

function grafSalda(niz, val){

  if (niz.length < 2) return '<p class="prazno">Graf se pojavi kad budu uvezena barem dva izvoda.</p>';

  var t0 = t[0], t1 = Math.max(t[t.length - 1], new Date(D.danas).getTime()), raspon = Math.max(1, t1 - t0);
  var lo = Math.min(0, Math.min.apply(null, v)), hi = Math.max.apply(null, v);
  var korak = Math.pow(10, Math.floor(Math.log10(Math.max(1, hi - lo)))); if ((hi - lo) / korak < 3) korak /= 2; if ((hi - lo) / korak > 6) korak *= 2;
  lo = Math.floor(lo / korak) * korak; hi = Math.max(lo + korak, Math.ceil(hi / korak) * korak);
  var L = 64, R = 704, T = 16, Bd = 200;
  function X(x){ return L + (x - t0) / raspon * (R - L); } function Y(y){ return Bd - (y - lo) / (hi - lo) * (Bd - T); }

  for (var g = lo; g <= hi + korak / 2; g += korak){ s += '<line x1="' + L + '" x2="' + R + '" y1="' + Y(g) + '" y2="' + Y(g) + '" stroke="rgba(11,11,12,' + (g === 0 ? ".25" : ".08") + ')"/><text x="' + (L - 8) + '" y="' + (Y(g) + 4) + '" text-anchor="end" font-size="11.5" fill="#5E6266">' + (Math.abs(g) >= 1000 ? (g / 1000).toLocaleString("hr-HR", {maximumFractionDigits: 1}) + "k" : g.toLocaleString("hr-HR")) + '</text>'; }
  var d = "M" + X(t[0]) + " " + Y(v[0]);
  for (var i = 1; i < t.length; i++) d += " H" + X(t[i]) + " V" + Y(v[i]);
  d += " H" + X(t1);
  s += '<path d="' + d + ' V' + Y(Math.max(lo, 0)) + ' H' + X(t[0]) + ' Z" fill="rgba(15,59,51,.07)"/><path d="' + d + '" fill="none" stroke="#0F3B33" stroke-width="2"/>';
  niz.forEach(function(x, i){ s += '<circle cx="' + X(t[i]) + '" cy="' + Y(v[i]) + '" r="3" fill="#0F3B33"><title>' + datumG(x[1]) + ': ' + iznosC(x[2], val) + '</title></circle>'; });
  var mjOznake = [], m0 = new Date(t0); m0 = new Date(m0.getFullYear(), m0.getMonth() + 1, 1);
  for (var m = m0; m.getTime() <= t1; m = new Date(m.getFullYear(), m.getMonth() + 1, 1)) mjOznake.push(m);
  var svaki = Math.ceil(mjOznake.length / 7);
  mjOznake.forEach(function(m, i){ if (i % svaki) return; s += '<text x="' + X(m.getTime()) + '" y="222" text-anchor="middle" font-size="12" fill="#5E6266">' + MJK[m.getMonth()] + '</text>'; });
  s += '<text x="' + R + '" y="' + (Y(v[v.length - 1]) - 10) + '" text-anchor="end" font-size="12" font-weight="600" fill="#0B0B0C">' + iznosC(niz[niz.length - 1][2], val) + '</text>';
  return '<svg viewBox="0 0 720 230" role="img" aria-label="Stanje računa po danima, zadnje ' + iznosC(niz[niz.length - 1][2], val) + '" style="width:100%;height:auto;display:block">' + s + '</svg>';
}

  if (!PO || !PO.mailovi.length) return;
  var ids = PO.mailovi.map(function(m){ return m.id; }), i = poMail ? ids.indexOf(poMail.id) : -1;
  var n = i < 0 ? 0 : Math.min(ids.length - 1, Math.max(0, i + korak));
  if (i === n && poMail) return;
  otvoriMail(ids[n]);
  setTimeout(function(){ var r = document.querySelector('.po-m[data-mail="' + ids[n] + '"]'); if (r) r.scrollIntoView({block: "nearest"}); }, 0);
}
// Radnja iz alatne trake čitača ili brzih gumba: trajno brisanje traži potvrdu, ostalo ide odmah.
function poRadnjaNaMail(id, radnja){
  if (radnja === "trajno") {
    if (poMail && poMail.id === id) { poPotvrda = "trajno"; poCrtaj("c"); }
    else { poOdabrano = {}; poOdabrano[id] = true; poPotvrda = "trajno-odabrano"; poCrtaj("l"); }
    return;
  }
  poRadi([id], radnja);
}

function veziPostu(){
  var app = document.getElementById("po-app");
  if (!app || app.dataset.vezano) return;
  app.dataset.vezano = "1";
  poCrtaj("lc");
  app.addEventListener("click", function(ev){
    var t = ev.target, b;
    if ((b = t.closest("[data-odaberi]"))) return; // promjena kvačice ide preko "change"
    if ((b = t.closest("[data-mapa]"))) { if (b.dataset.mapa !== poMapa || poPrikaz !== "mail") poPromijeniMapu(b.dataset.mapa); return; }
    if ((b = t.closest("[data-adresa]"))) { if (b.dataset.adresa !== poAdresa) poPromijeniMapu(poMapa, b.dataset.adresa); return; }
    if ((b = t.closest("[data-prikaz]"))) { poPrikaz = "blokirani"; poMail = null; if (poMob() && !poMobCitac) { poMobCitac = true; try { history.pushState({poCitac: 1}, "", location.hash); } catch (x) {} } poCrtaj("mlc"); return; }
    if ((b = t.closest("[data-zvjezdica]"))) { var zm = poNadji(Number(b.dataset.zvjezdica)); if (zm) poRadi([zm.id], zm.oznaceno ? "odznaci" : "oznaci"); return; }
    if ((b = t.closest("[data-brzo]"))) { poRadnjaNaMail(Number(b.dataset.id), b.dataset.brzo); return; }
    if ((b = t.closest("[data-otvori]"))) { otvoriMail(Number(b.dataset.otvori)); return; }
    if ((b = t.closest("[data-skupno]"))) {
      var ids = Object.keys(poOdabrano).map(Number);
      if (b.dataset.skupno === "trajno") { poPotvrda = "trajno-odabrano"; poCrtaj("l"); } else poRadi(ids, b.dataset.skupno);
      return;
    }
    if ((b = t.closest("[data-radnja]"))) { var r = b.dataset.radnja; if (poMail) { poRadnjaNaMail(poMail.id, r); } return; }
    if ((b = t.closest("[data-pregled]"))) {
      var p = (poMail.privitci || []).filter(function(x){ return x.i === Number(b.dataset.pregled); })[0];
      if (p) { poPregled = {id: poMail.id, i: p.i, naziv: p.naziv, vrsta: p.pregled}; poCrtaj(""); var z = document.querySelector('.po-lb-g [data-akcija="zatvori-pregled"]'); if (z) z.focus(); }
      return;
    }
    if ((b = t.closest("[data-blokiraj]"))) { b.disabled = true; blokiraj(b.dataset.blokiraj).catch(function(err){ poPoruka = "Nije blokirano: " + err.message; poPotvrda = ""; poCrtaj("c"); }); return; }
    if ((b = t.closest("[data-odblokiraj]"))) {
      b.disabled = true;
      postaPost("/api/posta/odblokiraj", {uzorak: b.dataset.odblokiraj}).then(function(){ blPoruka = "Odblokirano: " + b.dataset.odblokiraj + ". Postojeći mailovi ostaju u Spamu, vrati ih s Nije spam."; BL = null; poCrtaj("mc"); })
        .catch(function(err){ b.disabled = false; blPoruka = "Nije odblokirano: " + err.message; poCrtaj("c"); });
      return;
    }
    if ((b = t.closest("[data-akcija]"))) {
      var a = b.dataset.akcija;
      if (a === "zatvori-pregled" && b.classList.contains("po-lb") && t !== b) return; // klik unutar pregleda
      var vise = t.closest("details.po-vise"); if (vise) vise.open = false;
      if (a === "osvjezi") { b.classList.add("vrti"); ucitajPostu(PO ? "osvjezi" : "nova"); setTimeout(function(){ b.classList.remove("vrti"); }, 600); }
      else if (a === "starije") { b.disabled = true; b.textContent = "Učitavam…"; ucitajPostu("starije"); }
      else if (a === "natrag") { if (poPrikaz === "blokirani") { poPrikaz = "mail"; poCrtaj("m"); } zatvoriCitac(); }
      else if (a === "tekst") { poTekst = !poTekst; poCrtaj("c"); }
      else if (a === "blokiraj") { poPotvrda = poPotvrda === "blokiraj" ? "" : "blokiraj"; poCrtaj("c"); }
      else if (a === "odustani") { poPotvrda = ""; poCrtaj("lc"); }
      else if (a === "trajno-mail") { b.disabled = true; poObrisiTrajno([poMail.id]); }
      else if (a === "trajno-da") { b.disabled = true; poObrisiTrajno(Object.keys(poOdabrano)); }
      else if (a === "isprazni") { poPotvrda = "isprazni"; poCrtaj("l"); }
      else if (a === "isprazni-da") { b.disabled = true; poObrisiTrajno(null); }
      else if (a === "odznaci-sve") { poOdabrano = {}; poPotvrda = ""; poCrtaj("l"); }
      else if (a === "zatvori-pregled") { poPregled = null; poCrtaj(""); }
      else if (a === "ponisti") { poToast && poToast.ponisti && poToast.ponisti(); }
    }
  });
  app.addEventListener("change", function(ev){
    var t = ev.target;
    if (t.dataset.odaberi) { if (t.checked) poOdabrano[t.dataset.odaberi] = true; else delete poOdabrano[t.dataset.odaberi]; if (poPotvrda === "trajno-odabrano" || poPotvrda === "isprazni") poPotvrda = ""; poCrtaj("l"); }
    else if (t.id === "po-sve") { poOdabrano = {}; if (t.checked && PO) PO.mailovi.forEach(function(m){ poOdabrano[m.id] = true; }); poPotvrda = ""; poCrtaj("l"); }
    else if (t.id === "po-adresa-m") poPromijeniMapu(poMapa, t.value);
  });
  app.addEventListener("submit", function(ev){
    ev.preventDefault();
    if (ev.target.id === "po-trazi") { poTrazi = ev.target.t.value.trim(); PO = null; poOdabrano = {}; ucitajPostu("nova"); poCrtaj("l"); ev.target.t.blur(); }
    if (ev.target.id === "blokiraj-novi") { var u = ev.target.u.value.trim(); if (u) blokiraj(u).catch(function(err){ blPoruka = "Nije blokirano: " + err.message; poCrtaj("c"); }); }
  });
  // Brisanje pretrage (x u polju) odmah vraća cijeli popis.
  app.addEventListener("input", function(ev){ if (ev.target.id === "po-trazi-polje" && !ev.target.value && poTrazi) { poTrazi = ""; PO = null; ucitajPostu("nova"); poCrtaj("l"); } });
}
// Tipkovnički prečaci (kao u Gmailu), samo na ekranu Pošta i kad se ne piše u polje.
document.addEventListener("keydown", function(ev){
  if (ekran !== "posta" || ev.ctrlKey || ev.metaKey || ev.altKey) return;
  var t = ev.target;
  if (ev.key === "Escape") {
    if (poPregled) { poPregled = null; poCrtaj(""); }
    else if (poPotvrda) { poPotvrda = ""; poCrtaj("lc"); }
    else if (Object.keys(poOdabrano).length) { poOdabrano = {}; poCrtaj("l"); }
    else if (poMobCitac) zatvoriCitac();
    return;
  }
  if (/^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName) || t.isContentEditable || poPregled) return;
  var k = ev.key;
  if (k === "/") { ev.preventDefault(); var p = document.getElementById("po-trazi-polje"); if (p) { p.focus(); p.select(); } }
  else if (k === "j" || k === "ArrowDown" && t === document.body) { ev.preventDefault(); poOtvoriSusjedni(1); }
  else if (k === "k" || k === "ArrowUp" && t === document.body) { ev.preventDefault(); poOtvoriSusjedni(-1); }
  else if (!poMail || poMail.ucitavam || poPrikaz !== "mail") return;
  else if (k === "e") poRadnjaNaMail(poMail.id, poMail.mapa === "ulazni" ? "arhiva" : "ulazni");
  else if (k === "#" || k === "Delete") poRadnjaNaMail(poMail.id, poMail.mapa === "spam" || poMail.mapa === "obrisano" ? "trajno" : "obrisano");
  else if (k === "s") poRadi([poMail.id], poMail.oznaceno ? "odznaci" : "oznaci");
  else if (k === "u") poRadi([poMail.id], "neprocitano");
  else if (k === "!" && (poMail.mapa === "ulazni" || poMail.mapa === "arhiva")) poRadi([poMail.id], "spam");
  else if (k === "x") { if (poOdabrano[poMail.id]) delete poOdabrano[poMail.id]; else poOdabrano[poMail.id] = true; poCrtaj("l"); }
});
// Svake minute provjeri ima li nove pošte (i za broj uz Pošta u izborniku), osim dok je kartica skrivena ili traje pretraga.
setInterval(function(){ if (!document.hidden && PO && !poTrazi && !poUcitava) ucitajPostu("osvjezi"); }, 60 * 1000);
document.addEventListener("visibilitychange", function(){ if (!document.hidden && PO && !poTrazi && !poUcitava) ucitajPostu("osvjezi"); });

// ---------- Obavijesti (popis svih obavijesti mailom) ----------
var OB = null, obGreska = "";
var OB_UVJET = {mail: "treba RESEND_KEY i OBAVIJEST_NA", iban: "treba IZVODI_IBAN", fisk: "treba ključ za fisk-racun"};
function ucitajObavijesti(){
  fetch("/api/obavijesti", {credentials: "same-origin"}).then(function(r){ return r.json().then(function(j){ if(!r.ok) throw new Error(j.greska || r.status); return j; }); })
    .then(function(j){ OB = j; obGreska = ""; if (ekran === "obavijesti") crtaj(); })
    .catch(function(err){ obGreska = err.message; if (ekran === "obavijesti") crtaj(); });
}
function obavijestZaKljuc(k){
  var x = (OB.popis || []).filter(function(o){ return o.kljuc && (k === o.kljuc || k.indexOf(o.kljuc + ":") === 0); });
  return x.length ? x[0].naziv : k;
}
function obavijesti(){
  var h = '<div style="display:flex;flex-direction:column;gap:10px"><p class="lbl">Mail</p><h1>Obavijesti</h1></div>';
  if (obGreska) return h + '<section class="panel"><p class="prazno">Obavijesti se nisu učitale (' + e(obGreska) + '). Osvježi stranicu za minutu.</p></section>';
  if (!OB) { ucitajObavijesti(); return h + '<section class="panel"><p class="prazno">Učitavam obavijesti…</p></section>'; }
  var poslane = OB.poslane || [];
  function zadnje(o){
    if (!o.kljuc) return "šalje se odmah";
    var x = poslane.filter(function(p){ return p.kljuc === o.kljuc || p.kljuc.indexOf(o.kljuc + ":") === 0; });
    return x.length ? vrijeme(x[0].poslano) : "još nije";
  }
  h += '<section class="panel"><p style="margin:0">Sve obavijesti stižu na <b>' + e(OB.adresa || "(adresa nije postavljena)") + '</b>. Upiti i izvodi javljaju se odmah. Ostalo nadzor provjerava svaki sat u 15 minuta iza punog sata i sve novo šalje u jednom mailu. Svako upozorenje stiže samo jednom.</p></section>';
  h += '<section class="panel"><h2>Što se šalje</h2><div class="skrol"><table><thead><tr><th>Obavijest</th><th>Kada se šalje</th><th>Koliko često</th><th>Stanje</th><th>Zadnja</th></tr></thead><tbody>'
    + OB.popis.map(function(o){
      return '<tr><td style="font-weight:600">' + e(o.naziv) + '</td><td>' + e(o.kada) + '</td><td>' + e(o.ucestalost) + '</td><td class="nw">'
        + (o.ukljuceno ? '<span class="oznaka ok">uključeno</span>' : '<span class="oznaka lose">isključeno</span><br><span class="src">' + e(OB_UVJET[o.uvjet] || "") + '</span>')
        + '</td><td class="nw">' + e(zadnje(o)) + '</td></tr>';
    }).join("") + '</tbody></table></div></section>';
  h += '<section class="panel"><h2>Zadnje poslano</h2>' + (poslane.length ? '<div class="skrol"><table><thead><tr><th>Vrijeme</th><th>Obavijest</th><th>Oznaka</th></tr></thead><tbody>'
    + poslane.slice(0, 20).map(function(p){ return '<tr><td class="nw">' + e(vrijeme(p.poslano)) + '</td><td>' + e(obavijestZaKljuc(p.kljuc)) + '</td><td class="src">' + e(p.kljuc) + '</td></tr>'; }).join("")
    + '</tbody></table></div>' : '<p class="prazno">Satna upozorenja još nisu ništa poslala.</p>') + '</section>';
  return h;
}

setInterval(function(){ ucitaj(); if (R) ucitajRacune(); if (B) ucitajBanku(); if (KN) ucitajKnjige(); if (OB) ucitajObavijesti(); }, 10 * 60 * 1000);
// Broj nepročitanih mailova uz Pošta u izborniku. Mora biti ovdje, nakon što su varijable Pošte postavljene.
if (!PO) ucitajPostu("nova");
})();
