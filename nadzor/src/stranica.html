<!doctype html>
<html lang="hr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Nadzor poslovanja · Digitalni partner</title>
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--oniks:#0B0B0C;--smaragd:#0F3B33;--smaragd-svj:#E8EFED;--kamen:#E7E4DE;--kamen-svj:#F1EFEA;--grafit:#5E6266;--zlato:#C6A15B;--zlato-tamno:#7A5B1E;--zlato-svj:#FBF5E8;--kadulja:#6E8F86;--crvena:#A33A2A;--crvena-svj:#FBEDEA;--pozadina:#F6F6F3;--kartica:#FFFFFF;--linija:#E4E2DD;--linija-svj:#EFEDE9}
*{box-sizing:border-box}
body{margin:0;background:var(--pozadina);color:var(--oniks);font:400 15px/1.55 Manrope,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:var(--smaragd)}
h1,h2,p{margin:0}
h1{font-size:clamp(24px,3vw,30px);font-weight:700;letter-spacing:-.02em;line-height:1.15}
h2{font-size:16px;font-weight:700;letter-spacing:-.005em}
.wrap{max-width:1240px;margin:0 auto;padding:0 24px}
header{background:var(--smaragd);color:var(--kamen);position:sticky;top:0;z-index:5}
header .wrap{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 32px;min-height:64px}
.brand{display:flex;align-items:center;gap:12px}
.mono{width:30px;height:30px;border-radius:7px;background:var(--kamen);color:var(--smaragd);display:grid;place-items:center;font-weight:700;font-size:14px;letter-spacing:-.02em}
.word{font-size:17px;color:#fff}.word b{font-weight:700}
.sub{font-size:12.5px;color:rgba(231,228,222,.75);margin-left:4px;padding-left:12px;border-left:1px solid rgba(231,228,222,.3)}
nav{display:flex;flex-wrap:wrap;gap:4px}
nav button{background:none;border:0;border-radius:8px;font:600 14px Manrope,sans-serif;color:rgba(231,228,222,.8);padding:0 14px;cursor:pointer;min-height:40px;position:relative}
nav button:hover{background:rgba(255,255,255,.08);color:#fff}
nav button[aria-selected=true]{background:rgba(255,255,255,.12);color:#fff}
nav button[aria-selected=true]::after{content:"";position:absolute;left:14px;right:14px;bottom:4px;height:2px;border-radius:2px;background:var(--zlato)}
.traka{background:var(--zlato-svj);color:var(--oniks);font-size:13px;border-bottom:1px solid #EFE3C8}
.traka .wrap{padding-top:9px;padding-bottom:9px;display:flex;flex-wrap:wrap;gap:4px 12px;align-items:center}
.traka b{color:var(--zlato-tamno);font-size:12px;font-weight:700}
main .wrap{padding-top:28px;padding-bottom:48px;display:flex;flex-direction:column;gap:20px}
.lbl{font-size:12.5px;font-weight:600;color:var(--grafit)}
.panel{background:var(--kartica);border:1px solid var(--linija);border-radius:12px;box-shadow:0 1px 2px rgba(11,11,12,.04);padding:20px 22px;display:flex;flex-direction:column;gap:16px;min-width:0}
.red{display:flex;flex-wrap:wrap;gap:20px}
.red>.sir{flex:999 1 560px}.red>.uz{flex:1 1 320px}
.num{font-variant-numeric:tabular-nums}
.src{font-size:12.5px;color:var(--grafit)}
.og{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.04em;color:var(--zlato-tamno);background:var(--zlato-svj);border:1px solid #EFE3C8;border-radius:999px;padding:1px 7px;margin-left:8px;vertical-align:middle;line-height:1.5}
.zeleno{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:20px}
.zeleno>div,.kpi>div{background:var(--kartica);border:1px solid var(--linija);border-radius:12px;box-shadow:0 1px 2px rgba(11,11,12,.04);padding:20px 22px;display:flex;flex-direction:column;gap:8px;min-width:0}

.zeleno .k{font-size:13px;font-weight:600;color:var(--grafit)}
.zeleno .v{font-size:clamp(30px,4vw,38px);font-weight:700;letter-spacing:-.025em;line-height:1.1;color:var(--oniks)}
.zeleno .o{font-size:13px;color:var(--grafit)}
.bar{height:8px;border-radius:4px;background:var(--linija-svj);overflow:hidden}.bar i{display:block;height:100%;border-radius:4px;background:var(--smaragd)}
.kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:20px}
.kpi .v{font-size:30px;font-weight:700;letter-spacing:-.02em;line-height:1.15}
table{border-collapse:collapse;width:100%;font-size:14px}
th{text-align:left;font-size:12px;font-weight:600;color:var(--grafit);padding:0 16px 10px 0;border-bottom:1px solid var(--linija);white-space:nowrap}
td{padding:11px 16px 11px 0;border-bottom:1px solid var(--linija-svj);vertical-align:top}
tbody tr:last-child td{border-bottom:0}
.r{text-align:right}.nw{white-space:nowrap}
.skrol{overflow-x:auto}
.stavka{padding:10px 12px;border-radius:8px;background:var(--pozadina);border-left:3px solid var(--zlato);display:flex;flex-direction:column;gap:2px}
.stavka:has(.hitno){background:var(--crvena-svj);border-left-color:var(--crvena)}
.stavka b{font-size:11.5px;letter-spacing:.06em;color:var(--zlato-tamno)}
.stavka b.hitno{color:var(--crvena)}
.hitno{color:var(--crvena);font-weight:600}
.trak{height:8px;border-radius:4px;background:var(--linija-svj);overflow:hidden}.trak i{display:block;height:100%;border-radius:4px;background:var(--smaragd)}
.legenda{display:flex;flex-wrap:wrap;gap:14px;font-size:13px;color:var(--grafit)}
.legenda span{display:flex;align-items:center;gap:6px}.legenda i{width:10px;height:10px;border-radius:3px;display:inline-block}
form.unos{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;align-items:end;padding-top:16px;border-top:1px solid var(--linija-svj)}
label{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--grafit)}
input,select{font:inherit;font-size:14px;padding:8px 10px;border:1px solid #D4D1CB;border-radius:8px;background:#fff;color:var(--oniks);min-height:40px}
button.gumb{font:600 14px Manrope,sans-serif;background:var(--smaragd);color:#fff;border:0;border-radius:8px;padding:0 18px;min-height:40px;cursor:pointer}
button.gumb:hover{background:#0B2E28}
:focus-visible{outline:2px solid var(--zlato);outline-offset:2px}
footer .wrap{padding-top:4px;padding-bottom:28px;display:flex;flex-wrap:wrap;gap:6px 24px}
[hidden]{display:none!important}
.prazno{color:var(--grafit);font-size:14px}
.oznaka{display:inline-block;font-size:12px;font-weight:600;border-radius:999px;padding:1px 9px;line-height:1.6;white-space:nowrap}
.oznaka.ok{color:var(--smaragd);background:var(--smaragd-svj)}
.oznaka.ceka{color:var(--zlato-tamno);background:var(--zlato-svj)}
.oznaka.lose{color:var(--crvena);background:var(--crvena-svj)}
.filtri{display:flex;flex-wrap:wrap;gap:12px;align-items:end}
.jir{font-family:ui-monospace,Menlo,monospace;font-size:12px;color:var(--grafit);word-break:break-all}
svg text{font-family:Manrope,sans-serif}
@media (max-width:640px){.wrap{padding:0 16px}header .wrap{padding-top:8px;padding-bottom:8px}.sub{display:none}nav button{padding:0 10px}.panel,.zeleno>div,.kpi>div{padding:16px}}
</style>
</head>
<body>
<header><div class="wrap">
  <div class="brand"><div class="mono">dp</div><div class="word"><b>digitalni</b>partner</div><div class="sub">nadzor poslovanja</div></div>
  <nav role="tablist" aria-label="Ekrani">
    <button role="tab" data-ekran="pregled" aria-selected="true">Pregled</button>
    <button role="tab" data-ekran="usluge" aria-selected="false">Usluge</button>
    <button role="tab" data-ekran="aplikacije" aria-selected="false">Aplikacije</button>
    <button role="tab" data-ekran="vjencanja" aria-selected="false">Kuverta</button>
    <button role="tab" data-ekran="racuni" aria-selected="false">Računi</button>
    <button role="tab" data-ekran="banka" aria-selected="false">Banka</button>
  </nav>
</div></header>
<div class="traka" id="traka" hidden><div class="wrap"><b>OGLEDNI PODACI</b><span>Brojevi s oznakom OGLEDNO nisu stvarni. Nestaju kad se spoji pravi izvor.</span></div></div>
<main><div class="wrap" id="sadrzaj"><p class="prazno">Učitavam podatke…</p></div></main>
<footer><div class="wrap"><span class="src" id="osvjezeno"></span><span class="src" id="korisnik"></span></div></footer>

<script>
(function(){
"use strict";
var D = null, ekran = (location.hash || "#pregled").slice(1);
var MJ = ["siječanj","veljača","ožujak","travanj","svibanj","lipanj","srpanj","kolovoz","rujan","listopad","studeni","prosinac"];
var MJK = ["Sij","Velj","Ožu","Tra","Svi","Lip","Srp","Kol","Ruj","Lis","Stu","Pro"];
var PRAG = 60000;

function e(s){ return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]; }); }
function eur(n, dec){ var v = Number(n || 0); var s = v.toLocaleString("hr-HR", {minimumFractionDigits: dec ? 2 : 0, maximumFractionDigits: dec ? 2 : 0}); return s + " €"; }
function br(n){ return Number(n || 0).toLocaleString("hr-HR"); }
function pct(n){ return (n >= 0 ? "+" : "") + n.toLocaleString("hr-HR", {maximumFractionDigits: 1}) + " %"; }
function datum(d){ if(!d) return "–"; var p = String(d).slice(0,10).split("-"); return Number(p[2]) + ". " + Number(p[1]) + "."; }
function og(b){ return b ? '<span class="og">OGLEDNO</span>' : ""; }
function dana(d){ return Math.round((new Date(String(d).slice(0,10)) - new Date(D.danas)) / 864e5); }
function zbroj(a, f){ return a.reduce(function(s, x){ return s + Number(f(x) || 0); }, 0); }

function ucitaj(){
  fetch("/api/podaci", {credentials: "same-origin"}).then(function(r){ if(!r.ok) throw new Error(r.status); return r.json(); })
    .then(function(d){ D = d; crtaj(); })
    .catch(function(err){ document.getElementById("sadrzaj").innerHTML = '<p class="prazno">Podaci se nisu učitali (' + e(err.message) + '). Osvježi stranicu za minutu.</p>'; });
}

function crtaj(){
  var imaOgl = D.prihod_godina_ogledno || D.klijenti.some(function(k){ return k.ogledno; }) || Object.keys(D.metrike).some(function(k){ return D.metrike[k].ogledno; });
  document.getElementById("traka").hidden = !imaOgl;
  document.querySelectorAll("nav button").forEach(function(b){ b.setAttribute("aria-selected", b.dataset.ekran === ekran ? "true" : "false"); });
  var f = {pregled: pregled, usluge: usluge, aplikacije: aplikacije, vjencanja: vjencanja, racuni: racuni, banka: banka}[ekran] || pregled;
  document.getElementById("sadrzaj").innerHTML = f();
  if (ekran === "pregled") vezi();
  if (ekran === "usluge") veziUpite();
  if (ekran === "racuni") veziRacune();
  if (ekran === "banka") veziBanku();
  var o = D.osvjezavanja, dijelovi = Object.keys(o).map(function(k){ var x = o[k]; return k + ": " + new Date(x.vrijeme).toLocaleString("hr-HR", {day:"numeric",month:"numeric",hour:"2-digit",minute:"2-digit"}) + (x.uspjeh ? "" : " (greška)"); });
  document.getElementById("osvjezeno").textContent = dijelovi.length ? "Zadnje osvježavanje · " + dijelovi.join(" · ") : "Prikupljači se još nisu pokrenuli.";
  document.getElementById("korisnik").textContent = D.korisnik ? "Prijavljen: " + D.korisnik : "";
}

// ---------- izračuni ----------
function mjeseci(){ return D.prihodi_po_mjesecima; }
function ovaj(){ var m = mjeseci(); return m[m.length - 1]; }
function prosli(){ var m = mjeseci(); return m[m.length - 2]; }
function ukupno(m){ return Number(m.usluge) + Number(m.aplikacije) + Number(m.vjencanja); }
function mrr(){ return zbroj(D.klijenti, function(k){ return k.mjesecno; }); }
function klijOgl(){ return D.klijenti.some(function(k){ return k.ogledno; }); }
function met(k){ return D.metrike[k] || null; }

// ---------- Pregled ----------
function pregled(){
  var t = ovaj(), p = prosli(), u = ukupno(t), up = ukupno(p);
  var promjena = up ? (u - up) / up * 100 : 0;
  var god = Number(D.prihod_godina), udio = Math.min(100, god / PRAG * 100);
  var danUGod = (new Date(D.danas) - new Date(D.danas.slice(0,4) + "-01-01")) / 864e5 + 1;
  var tempo = god / danUGod, ostaje = tempo > 0 ? (PRAG - god) / tempo : Infinity;
  var kad = god >= PRAG ? "Prag je dosegnut." : (isFinite(ostaje) ? "Uz ovaj tempo prag se dostiže oko " + new Date(Date.now() + ostaje * 864e5).toLocaleDateString("hr-HR", {month:"long", year:"numeric"}).replace(/\.$/, "") + "." : "Još nema prihoda.");
  var mj = MJ[Number(D.danas.slice(5,7)) - 1];

  var h = '<div style="display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:12px 32px"><div style="display:flex;flex-direction:column;gap:10px"><p class="lbl">Cijeli obrt</p><h1>' + e(mj.charAt(0).toUpperCase() + mj.slice(1)) + ' ' + D.danas.slice(0,4) + '.</h1></div><p class="src">Stanje ' + datum(D.danas) + '</p></div>';
  h += '<section class="zeleno" aria-label="Glavni brojevi">'
    + '<div><span class="k">Prihod ovog mjeseca' + og(t.ogledno) + '</span><span class="v num">' + eur(u) + '</span><span class="o">' + (up ? pct(promjena) + " u odnosu na prošli mjesec (" + eur(up) + ")" : "Prošli mjesec bez prihoda.") + '</span></div>'
    + '<div><span class="k">Mjesečni ponavljajući prihod' + og(klijOgl()) + '</span><span class="v num">' + eur(mrr()) + '</span><span class="o">' + D.klijenti.length + ' aktivnih klijenata</span></div>'
    + '<div style="border-right:0"><span class="k">Prag od 60.000 € ove godine' + og(D.prihod_godina_ogledno) + '</span><span class="v num">' + Math.round(udio) + ' %</span><div class="bar" role="img" aria-label="Naplaćeno ' + eur(god) + ' od 60.000 €"><i style="width:' + udio.toFixed(1) + '%"></i></div><span class="o">' + eur(god) + ' naplaćeno. ' + kad + '</span></div>'
    + '</section>';

  h += '<div class="red"><section class="panel sir"><div style="display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px"><h2>Prihod po mjesecima' + og(mjeseci().some(function(m){ return m.ogledno; })) + '</h2><div class="legenda"><span><i style="background:#0F3B33"></i>Usluge</span><span><i style="background:#6E8F86"></i>Aplikacije</span><span><i style="background:#C6A15B"></i>Kuverta</span></div></div><p class="num" id="tip" style="min-height:22px;font-size:14px"></p>' + grafPrihoda() + '<p class="src">Iznosi su nakon provizije Applea i naknada Stripea.</p></section>';
  h += '<section class="panel uz"><h2>Za danas</h2>' + zaDanas() + '</section></div>';

  var kv = D.kuverta || {};
  h += '<section class="panel"><h2>Poslovne linije</h2><div class="skrol"><table class="num"><thead><tr><th>Linija</th><th class="r">Ovaj mjesec</th><th class="r">Prošli</th><th>Korisnici</th><th>Ključni broj</th></tr></thead><tbody>'
    + linija("#0F3B33", "Usluge za klijente", t.usluge, p.usluge, D.klijenti.length + " klijenata" + og(klijOgl()), "MRR " + eur(mrr()))
    + linija("#6E8F86", "Aplikacije", t.aplikacije, p.aplikacije, met("aplikacije.aktivni_mjesecno") ? br(met("aplikacije.aktivni_mjesecno").vrijednost) + " aktivnih mjesečno" + og(met("aplikacije.aktivni_mjesecno").ogledno) : "nije spojeno", met("aplikacije.pretplatnici") ? br(met("aplikacije.pretplatnici").vrijednost) + " pretplatnika" : "")
    + linija("#C6A15B", "Kuverta", t.vjencanja, p.vjencanja, kv.greska ? "baza nedostupna" : br(kv.pozivnice) + " pozivnica u bazi", kv.greska ? "" : br(zbroj(kv.po_mjesecima || [], function(x){ return x.broj; })) + " vjenčanja u 12 mjeseci")
    + '</tbody></table></div></section>';

  var tr = D.troskovi_ovaj_mjesec, tu = zbroj(tr, function(x){ return x.iznos; });
  h += '<section class="panel"><div style="display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px"><h2>Troškovi ovog mjeseca' + og(tr.some(function(x){ return x.ogledno; })) + '</h2><span class="num" style="font-weight:600">' + eur(tu, true) + ' · dobit ' + eur(u - tu, true) + '</span></div>'
    + (tr.length ? '<div class="skrol"><table class="num"><tbody>' + tr.map(function(x){ return '<tr><td>' + e(x.opis) + og(x.ogledno) + '</td><td class="src">' + e(x.linija) + '</td><td class="nw">' + datum(x.datum) + '</td><td class="r nw">' + eur(x.iznos, true) + '</td></tr>'; }).join("") + '</tbody></table></div>' : '<p class="prazno">Ovaj mjesec još nema upisanih troškova.</p>')
    + '<form class="unos" id="trosak"><label>Datum<input name="datum" type="date" required value="' + D.danas + '"></label><label>Opis<input name="opis" required maxlength="200" placeholder="npr. domena"></label><label>Iznos (€)<input name="iznos" type="number" step="0.01" min="0" required></label><label>Linija<select name="linija"><option value="obrt">Obrt</option><option value="usluge">Usluge</option><option value="aplikacije">Aplikacije</option><option value="vjencanja">Kuverta</option></select></label><button class="gumb" type="submit">Dodaj trošak</button></form><p class="src" id="trosak-poruka" role="status"></p></section>';
  return h;
}

function linija(boja, ime, a, b, korisnici, kljucni){
  var ch = Number(b) ? pct((a - b) / b * 100) : "–";
  return '<tr><td class="nw" style="font-weight:600"><i style="display:inline-block;width:10px;height:10px;background:' + boja + ';margin-right:10px"></i>' + e(ime) + '</td><td class="r nw">' + eur(a) + '</td><td class="r nw">' + eur(b) + ' <span class="src">' + ch + '</span></td><td>' + korisnici + '</td><td>' + e(kljucni) + '</td></tr>';
}

function grafPrihoda(){
  var m = mjeseci(), max = Math.max(1000, Math.max.apply(null, m.map(ukupno)));
  var korak = max > 6000 ? 2000 : (max > 3000 ? 1000 : 500); max = Math.ceil(max / korak) * korak;
  var base = 240, ph = 205, slot = (712 - 56) / m.length, w = Math.min(56, slot * .6), s = "";
  for (var g = 0; g <= max; g += korak){ var y = base - g / max * ph; s += '<line x1="56" x2="712" y1="' + y + '" y2="' + y + '" stroke="rgba(11,11,12,.08)"/><text x="48" y="' + (y + 4) + '" text-anchor="end" font-size="11.5" fill="#5E6266">' + (g ? (g >= 1000 ? (g / 1000) + "k" : g) : 0) + '</text>'; }
  m.forEach(function(x, i){
    var X = 56 + i * slot + (slot - w) / 2, y = base, seg = [["usluge","#0F3B33"],["aplikacije","#6E8F86"],["vjencanja","#C6A15B"]];
    seg.forEach(function(sg){ var hh = Number(x[sg[0]]) / max * ph; if (hh > 0){ y -= hh; s += '<rect x="' + X + '" y="' + y + '" width="' + w + '" height="' + Math.max(0, hh - 2) + '" fill="' + sg[1] + '"/>'; } });
    var mi = Number(x.mjesec.slice(5,7)) - 1;
    s += '<text x="' + (X + w / 2) + '" y="' + (y - 8) + '" text-anchor="middle" font-size="12" font-weight="600" fill="#0B0B0C">' + (ukupno(x) ? eur(ukupno(x)) : "") + '</text><text x="' + (X + w / 2) + '" y="262" text-anchor="middle" font-size="12" fill="#5E6266">' + MJK[mi] + '</text>';
    s += '<rect class="hit" data-i="' + i + '" x="' + (56 + i * slot) + '" y="0" width="' + slot + '" height="270" fill="transparent" tabindex="0" aria-label="' + MJ[mi] + ' ' + eur(ukupno(x)) + '"/>';
  });
  return '<svg viewBox="0 0 720 270" role="img" aria-label="Prihod po mjesecima, složeno po linijama" style="width:100%;height:auto;display:block">' + s + '</svg>';
}

function zaDanas(){
  var st = [];
  D.klijenti.forEach(function(k){
    if (k.stanje === "neuspjela naplata") st.push(["hitno", "NEUSPJELA NAPLATA", e(k.oznaka) + ", " + e(k.paket) + ", " + eur(k.mjesecno) + "." + og(k.ogledno)]);
    if (k.obveza_do && dana(k.obveza_do) >= 0 && dana(k.obveza_do) <= 30) st.push(["", "OBVEZA ISTJEČE", e(k.oznaka) + ", " + e(k.paket) + ". Minimalna 3 mjeseca prolaze " + datum(k.obveza_do) + og(k.ogledno)]);
  });
  D.upiti.forEach(function(u){ var sati = (Date.now() - new Date(u.stvoreno)) / 36e5; if (u.status === "novi" && sati > 24) st.push(["hitno", "UPIT BEZ ODGOVORA", e(u.ime) + ", poslan prije " + Math.round(sati) + " h." + og(u.ogledno)]); });

// ---------- Banka (izvodi CAMT.053) ----------

    .then(function(j){ B = j; bGreska = ""; if (!B.racuni.some(function(x){ return x.iban === bFiltar.iban; })) bFiltar.iban = B.racuni.length ? B.racuni[0].iban : ""; if (ekran === "banka") crtaj(); })
    .catch(function(err){ bGreska = err.message; if (ekran === "banka") crtaj(); });
}
function iznosC(c, valuta){ var s = (Number(c || 0) / 100).toLocaleString("hr-HR", {minimumFractionDigits: 2, maximumFractionDigits: 2}); return s + (valuta && valuta !== "EUR" ? " " + valuta : " €"); }
function promjenaC(c, valuta){ return (c > 0 ? "+" : (c < 0 ? "−" : "")) + iznosC(Math.abs(c), valuta); }
function ibanF(i){ return String(i || "").replace(/(.{4})/g, "$1 ").trim(); }
function datumG(d){ return d ? datum(d) + " " + String(d).slice(0,4) + "." : "–"; }
function banka(){
  var h = '<div style="display:flex;flex-direction:column;gap:10px"><p class="lbl">Banka · izvodi CAMT.053</p><h1>Stanje računa</h1></div>';
  if (bGreska) return h + '<section class="panel"><p class="prazno">Izvodi se nisu učitali (' + e(bGreska) + '). Osvježi stranicu za minutu.</p></section>' + uvozIzvoda();
  if (!B) { ucitajBanku(); return h + '<section class="panel"><p class="prazno">Učitavam izvode…</p></section>'; }

  var r = B.racuni.filter(function(x){ return x.iban === bFiltar.iban; })[0] || B.racuni[0], val = r.valuta;

  var pr = knj.filter(function(x){ return x.iznos_centi > 0; }), od = knj.filter(function(x){ return x.iznos_centi < 0; });
  var star = -dana(r.stanje_datum), stari = star > 7;
  if (B.racuni.length > 1) h += '<form class="filtri" id="bracun"><label>Račun<select name="iban">' + B.racuni.map(function(x){ return '<option value="' + e(x.iban) + '"' + (x.iban === r.iban ? " selected" : "") + '>' + e(ibanF(x.iban)) + (x.vlasnik ? " · " + e(x.vlasnik) : "") + '</option>'; }).join("") + '</select></label></form>';
  h += '<section class="kpi">'
    + '<div><span class="src">Stanje na računu</span><span class="v num">' + iznosC(r.stanje_centi, val) + '</span><span class="src">' + e(ibanF(r.iban)) + '<br>izvod ' + (r.redni_broj ? "br. " + e(r.redni_broj) + " " : "") + 'na dan ' + datumG(r.stanje_datum) + (r.raspolozivo_centi != null && r.raspolozivo_centi !== r.stanje_centi ? "<br>raspoloživo " + iznosC(r.raspolozivo_centi, val) : "") + '</span></div>'
    + '<div><span class="src">Priljevi ovaj mjesec</span><span class="v num">' + iznosC(zbroj(pr, function(x){ return x.iznos_centi; }), val) + '</span><span class="src">' + pr.length + ' uplata</span></div>'
    + '<div><span class="src">Odljevi ovaj mjesec</span><span class="v num">' + iznosC(-zbroj(od, function(x){ return x.iznos_centi; }), val) + '</span><span class="src">' + od.length + ' isplata</span></div>'
    + '<div><span class="src">Zadnji izvod</span><span class="v num' + (stari ? ' hitno' : '') + '">' + (star <= 0 ? "danas" : (star === 1 ? "jučer" : "prije " + star + " dana")) + '</span><span class="src">' + (stari ? "Stanje možda nije točno. Uvezi novije izvode." : "Stanje je završno stanje s tog izvoda.") + '</span></div></section>';
  h += uvozIzvoda();
  h += '<section class="panel"><h2>Stanje kroz vrijeme</h2>' + grafSalda(B.salda.filter(function(x){ return x[0] === r.iban; }), val) + '<p class="src">Završno stanje sa svakog uvezenog izvoda, zadnjih 13 mjeseci. Dani bez izvoda preuzimaju stanje prethodnog.</p></section>';

  var mjeseci = [];
  st.forEach(function(x){ var m = String(x.knjizeno).slice(0,7); if (mjeseci.indexOf(m) < 0) mjeseci.push(m); });
  if (bFiltar.mjesec === null || (bFiltar.mjesec && mjeseci.indexOf(bFiltar.mjesec) < 0)) bFiltar.mjesec = mjeseci[0] || "";
  var lista = st.filter(function(x){ return (!bFiltar.mjesec || String(x.knjizeno).slice(0,7) === bFiltar.mjesec) && (!bFiltar.smjer || (bFiltar.smjer === "+" ? x.iznos_centi > 0 : x.iznos_centi < 0)); });
  var prikaz = lista.slice(0, 300);
  h += '<section class="panel"><div style="display:flex;flex-wrap:wrap;justify-content:space-between;align-items:end;gap:12px"><h2>Promet</h2><form class="filtri" id="bfiltri">'
    + '<label>Mjesec<select name="mjesec"><option value="">svi</option>' + mjeseci.map(function(m){ return '<option value="' + m + '"' + (m === bFiltar.mjesec ? " selected" : "") + '>' + MJ[Number(m.slice(5,7)) - 1] + ' ' + m.slice(0,4) + '.</option>'; }).join("") + '</select></label>'
    + '<label>Smjer<select name="smjer">' + [["", "sve"], ["+", "priljevi"], ["-", "odljevi"]].map(function(o){ return '<option value="' + o[0] + '"' + (o[0] === bFiltar.smjer ? " selected" : "") + '>' + o[1] + '</option>'; }).join("") + '</select></label></form></div>';

    + prikaz.map(function(x){
      var oznake = (/stripe/i.test((x.protustrana || "") + " " + (x.opis || "")) ? '<span class="og">STRIPE</span>' : "") + (x.status !== "BOOK" ? '<span class="og">NA ČEKANJU</span>' : "") + (x.storno ? '<span class="og">STORNO</span>' : "") + (x.broj_transakcija > 1 ? '<span class="og">' + x.broj_transakcija + ' TRANSAKCIJA</span>' : "");
      return '<tr><td class="nw">' + datumG(x.knjizeno) + '</td><td style="min-width:160px;font-weight:600">' + e(x.protustrana || "–") + oznake + (x.protustrana_iban ? '<div class="jir">' + e(ibanF(x.protustrana_iban)) + '</div>' : "") + '</td>'
        + '<td style="min-width:200px">' + e(x.opis || "–") + '</td><td class="jir">' + e(x.poziv_na_broj || "–") + '</td>'
        + '<td class="r nw" style="font-weight:600;' + (x.iznos_centi > 0 ? "color:var(--smaragd)" : "") + (x.status !== "BOOK" ? ";opacity:.6" : "") + '">' + promjenaC(x.iznos_centi, x.valuta) + '</td><td class="nw src">' + e(x.izvod) + '</td></tr>';
    }).join("") + '</tbody></table></div>';
  if (lista.length > prikaz.length) h += '<p class="src">Prikazano prvih ' + prikaz.length + ' od ' + lista.length + ' stavki. Suzi odabir mjesecom.</p>';
  h += '</section>';

  var sviIz = B.izvodi.filter(function(x){ return x.iban === r.iban; }), iz = bSviIzvodi ? sviIz : sviIz.slice(0, 10);
  h += '<section class="panel"><h2>Uvezeni izvodi</h2><div class="skrol"><table class="num"><thead><tr><th>Izvod</th><th>Razdoblje</th><th class="r">Početno</th><th class="r">Promet</th><th class="r">Završno</th><th class="r">Stavki</th><th>Provjera</th><th>Datoteka</th></tr></thead><tbody>'
    + iz.map(function(x){
      var pr = x.pocetno_centi == null ? null : x.zavrsno_centi - x.pocetno_centi;
      var pv = x.uskladeno === true ? '<span class="oznaka ok">usklađen</span>' : (x.uskladeno === false ? '<span class="oznaka lose">ne slaže se</span>' : '<span class="oznaka ceka">bez početnog</span>');
      return '<tr><td class="nw" style="font-weight:600">' + e(x.redni_broj ? "br. " + x.redni_broj : x.oznaka) + '</td><td class="nw">' + (x.od && x.od !== x.do ? datum(x.od) + " – " : "") + datumG(x.do || x.zavrsno_datum) + '</td>'
        + '<td class="r nw">' + (x.pocetno_centi == null ? "–" : iznosC(x.pocetno_centi, x.valuta)) + '</td><td class="r nw">' + (pr == null ? "–" : promjenaC(pr, x.valuta)) + '</td><td class="r nw" style="font-weight:600">' + iznosC(x.zavrsno_centi, x.valuta) + '</td>'
        + '<td class="r">' + x.stavki + '</td><td>' + pv + '</td><td class="src" style="word-break:break-all">' + e(x.datoteka || "–") + '<br>uvezen ' + vrijeme(x.uvezeno) + '</td></tr>';
    }).join("") + '</tbody></table></div>' + (sviIz.length > iz.length ? '<p><button class="gumb" type="button" id="svi-izvodi" style="background:var(--kamen-svj);color:var(--oniks)">Prikaži svih ' + sviIz.length + '</button></p>' : "") + '<p class="src">Provjera: početno stanje i knjiženi promet moraju dati završno stanje. Ako se ne slaže, izvod je nepotpun ili ga banka drukčije zbraja.</p></section>';

function uvozIzvoda(){
  return '<section class="panel"><h2>Uvoz izvoda</h2><p class="src">Izvodi koji stižu mailom uvoze se sami (vidi „izvodi-mail” u dnu stranice). Ručno: izvod u formatu <b>CAMT.053</b> (XML ili ZIP s XML-ovima). Može više datoteka odjednom, a izvod koji je već uvezen se preskače.</p>'
    + '<form class="filtri" id="izvod"><label>Datoteke izvoda<input name="datoteke" type="file" accept=".xml,.zip,application/xml,text/xml,application/zip" multiple required></label><button class="gumb" type="submit">Uvezi</button></form><p class="src" id="izvod-poruka" role="status" style="white-space:pre-line">' + e(bPoruka) + '</p></section>';
}
function grafSalda(niz, val){
  if (!niz.length) return '<p class="prazno">Nema izvoda u zadnjih 13 mjeseci.</p>';
  if (niz.length < 2) return '<p class="prazno">Graf se pojavi kad budu uvezena barem dva izvoda.</p>';
  var t = niz.map(function(x){ return new Date(x[1]).getTime(); }), v = niz.map(function(x){ return x[2] / 100; });
  var t0 = t[0], t1 = Math.max(t[t.length - 1], new Date(D.danas).getTime()), raspon = Math.max(1, t1 - t0);
  var lo = Math.min(0, Math.min.apply(null, v)), hi = Math.max.apply(null, v);
  var korak = Math.pow(10, Math.floor(Math.log10(Math.max(1, hi - lo)))); if ((hi - lo) / korak < 3) korak /= 2; if ((hi - lo) / korak > 6) korak *= 2;
  lo = Math.floor(lo / korak) * korak; hi = Math.max(lo + korak, Math.ceil(hi / korak) * korak);
  var L = 64, R = 704, T = 16, Bd = 200;
  function X(x){ return L + (x - t0) / raspon * (R - L); } function Y(y){ return Bd - (y - lo) / (hi - lo) * (Bd - T); }
  var s = "";
  for (var g = lo; g <= hi + korak / 2; g += korak){ s += '<line x1="' + L + '" x2="' + R + '" y1="' + Y(g) + '" y2="' + Y(g) + '" stroke="rgba(11,11,12,' + (g === 0 ? ".25" : ".08") + ')"/><text x="' + (L - 8) + '" y="' + (Y(g) + 4) + '" text-anchor="end" font-size="11.5" fill="#5E6266">' + (Math.abs(g) >= 1000 ? (g / 1000).toLocaleString("hr-HR", {maximumFractionDigits: 1}) + "k" : g.toLocaleString("hr-HR")) + '</text>'; }
  var d = "M" + X(t[0]) + " " + Y(v[0]);
  for (var i = 1; i < t.length; i++) d += " H" + X(t[i]) + " V" + Y(v[i]);
  d += " H" + X(t1);
  s += '<path d="' + d + ' V' + Y(Math.max(lo, 0)) + ' H' + X(t[0]) + ' Z" fill="rgba(15,59,51,.07)"/><path d="' + d + '" fill="none" stroke="#0F3B33" stroke-width="2"/>';
  niz.forEach(function(x, i){ s += '<circle cx="' + X(t[i]) + '" cy="' + Y(v[i]) + '" r="3" fill="#0F3B33"><title>' + datumG(x[1]) + ': ' + iznosC(x[2], val) + '</title></circle>'; });
  var mjOznake = [], m0 = new Date(t0); m0 = new Date(m0.getFullYear(), m0.getMonth() + 1, 1);
  for (var m = m0; m.getTime() <= t1; m = new Date(m.getFullYear(), m.getMonth() + 1, 1)) mjOznake.push(m);
  var svaki = Math.ceil(mjOznake.length / 7);
  mjOznake.forEach(function(m, i){ if (i % svaki) return; s += '<text x="' + X(m.getTime()) + '" y="222" text-anchor="middle" font-size="12" fill="#5E6266">' + MJK[m.getMonth()] + '</text>'; });
  s += '<text x="' + R + '" y="' + (Y(v[v.length - 1]) - 10) + '" text-anchor="end" font-size="12" font-weight="600" fill="#0B0B0C">' + iznosC(niz[niz.length - 1][2], val) + '</text>';
  return '<svg viewBox="0 0 720 230" role="img" aria-label="Stanje računa po danima, zadnje ' + iznosC(niz[niz.length - 1][2], val) + '" style="width:100%;height:auto;display:block">' + s + '</svg>';
}
function veziBanku(){
  var fr = document.getElementById("bracun");
  if (fr) fr.addEventListener("change", function(){ bFiltar = {iban: fr.iban.value, smjer: "", mjesec: null}; crtaj(); });
  var si = document.getElementById("svi-izvodi");
  if (si) si.addEventListener("click", function(){ bSviIzvodi = true; crtaj(); });
  var ff = document.getElementById("bfiltri");
  if (ff) ff.addEventListener("change", function(){ bFiltar.mjesec = ff.mjesec.value; bFiltar.smjer = ff.smjer.value; crtaj(); });
  var f = document.getElementById("izvod"), por = document.getElementById("izvod-poruka");
  if (!f) return;
  f.addEventListener("submit", function(ev){
    ev.preventDefault();
    var dat = Array.prototype.slice.call(f.datoteke.files), redovi = [];
    if (!dat.length) return;
    f.querySelector("button").disabled = true; por.textContent = "Uvozim " + dat.length + (dat.length === 1 ? " datoteku…" : " datoteka…");
    dat.reduce(function(p, d){
      return p.then(function(){
        return fetch("/api/izvod", {method: "POST", credentials: "same-origin", headers: {"content-type": "application/xml", "x-naziv": encodeURIComponent(d.name)}, body: d})
          .then(function(r){ return r.json().then(function(j){ if (!r.ok) throw new Error(j.greska || r.status); return j; }); })
          .then(function(j){
            var t = [];
            if (j.uvezeni.length) t.push("uvezeno izvoda: " + j.uvezeni.length);
            if (j.preskoceni.length) t.push("već uvezeno: " + j.preskoceni.length);
            if (j.neuskladeni.length) t.push("ne slaže se: " + j.neuskladeni.join(", "));
            redovi.push(d.name + ": " + t.join(", ") + ".");
          })
          .catch(function(err){ redovi.push(d.name + ": nije uvezeno. " + err.message); });
      });
    }, Promise.resolve()).then(function(){ bPoruka = redovi.join("\n"); B = null; ucitajBanku(); });
  });
}

document.querySelectorAll("nav button").forEach(function(b){ b.addEventListener("click", function(){ ekran = b.dataset.ekran; history.replaceState(null, "", "#" + ekran); if (D) crtaj(); window.scrollTo(0, 0); }); });
